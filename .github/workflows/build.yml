name: Build Tizen, webOS, and Web

on:
  pull_request:
  push:
    branches: [ main, develop ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tizen bundle
        run: pnpm --filter @pelagica/tizen build

      - name: Build webOS bundle
        run: pnpm --filter @pelagica/webos build

      - name: Build web client
        run: pnpm --filter pelagica build
